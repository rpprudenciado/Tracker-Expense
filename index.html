<!--
PROGRAM NAME: index.html
DESCRIPTION: Simple daily expense tracker styled with Tailwind CSS.
AUTHOR: Prudenciado, Rhona-Mae
DATE COMPILED: November 24, 2026
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker Expense</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: '#100007',
                        midnight: '#200116',
                        mahogany: '#2D0605',
                        crimson: '#4C0827',
                        linen: '#E6EBE0',
                        paper: '#F5F7F2'
                    }
                }
            }
        };
    </script>
    <script defer src="script.js"></script>
    <style>
        html,
        body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-linen text-mahogany font-sans antialiased">

    <header class="bg-coffee border-b-4 border-crimson px-6 md:px-10 py-4 flex items-center justify-between gap-4">
        <span class="text-linen text-xl font-bold tracking-tight">Tracker Expense</span>
        <span id="today-date"
            class="text-xs font-medium text-linen/80 border border-linen/20 bg-white/5 px-3 py-1 rounded-full">
            Daily Budget
        </span>
    </header>

    <main class="w-full max-w-5xl mx-auto px-5 py-8 flex-1">

        <section
            class="bg-gradient-to-br from-coffee via-midnight to-[#34051c] text-linen rounded-xl p-6 md:p-7 mb-7 shadow-xl border border-linen/10">
            <div class="flex flex-wrap items-end justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-widest text-linen/60 mb-1">Personal Finance</p>
                    <h1 class="text-2xl font-bold text-white">Daily Expense Tracker</h1>
                    <p class="text-sm text-linen/75 mt-1">Log your daily spending and filter expenses by category.</p>
                </div>

                <div
                    class="bg-white/5 border border-linen/15 rounded-lg px-5 py-3 text-left sm:text-right min-w-[210px]">
                    <span id="total-label" class="block text-xs uppercase tracking-wider text-linen/70">Total
                        (All)</span>
                    <div id="total-amount" class="text-2xl md:text-3xl font-bold text-white tabular-nums"
                        aria-live="polite">
                        PHP 0.00
                    </div>
                    <p id="expense-count" class="text-xs text-linen/70">0 items shown</p>
                </div>
            </div>

            <div id="summary-legend-row"
                class="hidden mt-5 pt-4 border-t border-linen/15 flex flex-wrap items-center justify-between gap-3">
                <div id="summary-legend"
                    class="flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-linen/85 tabular-nums"></div>
                <button type="button" id="customize-btn"
                    class="text-xs font-medium text-linen/85 hover:text-white border border-linen/25 hover:border-linen/50 px-3 py-1 rounded-full transition">
                    Customize
                </button>
            </div>

            <div id="customize-tray" class="hidden mt-3 pt-3 border-t border-linen/10">
                <p class="text-xs text-linen/70 mb-2">Choose categories to display above:</p>
                <div id="customize-options" class="flex flex-wrap gap-2"></div>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-12 gap-6 items-stretch">

            <article
                class="md:col-span-5 bg-white rounded-xl p-6 shadow-lg border border-crimson/15 border-t-4 border-t-crimson flex flex-col">
                <h2 class="text-lg font-bold text-coffee pb-3 mb-4 border-b border-crimson/15">Add New Expense</h2>

                <form id="expense-form" class="flex flex-col flex-1 gap-4" novalidate>
                    <div>
                        <label for="expense-title"
                            class="block text-xs font-semibold text-mahogany mb-1.5">Title</label>
                        <input type="text" id="expense-title" placeholder="e.g., Siomai Rice" maxlength="60" required
                            class="w-full px-3.5 py-2.5 text-sm bg-paper border border-crimson/20 rounded-lg focus:outline-none focus:bg-white focus:border-crimson focus:ring-2 focus:ring-crimson/15 transition">
                    </div>

                    <div>
                        <label for="expense-amount" class="block text-xs font-semibold text-mahogany mb-1.5">Amount
                            (PHP)</label>
                        <input type="number" id="expense-amount" placeholder="0.00" step="0.01" min="0.01" required
                            class="w-full px-3.5 py-2.5 text-sm bg-paper border border-crimson/20 rounded-lg tabular-nums focus:outline-none focus:bg-white focus:border-crimson focus:ring-2 focus:ring-crimson/15 transition">
                    </div>

                    <div>
                        <label id="category-label"
                            class="block text-xs font-semibold text-mahogany mb-1.5">Category</label>
                        <div id="category-dropdown" class="relative">
                            <button type="button" id="category-trigger" aria-haspopup="listbox" aria-expanded="false"
                                aria-labelledby="category-label category-selected-text"
                                class="w-full px-3.5 py-2.5 text-sm bg-paper border border-crimson/20 rounded-lg flex items-center justify-between gap-2 hover:bg-white hover:border-crimson/40 focus:outline-none focus:bg-white focus:border-crimson focus:ring-2 focus:ring-crimson/15 transition cursor-pointer">
                                <span id="category-selected-text" class="text-mahogany/50 truncate">Select a
                                    category...</span>
                                <svg id="category-chevron"
                                    class="w-4 h-4 text-mahogany/60 shrink-0 transition-transform duration-200"
                                    viewBox="0 0 20 20" fill="none" aria-hidden="true">
                                    <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.8"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>

                            <div id="category-menu"
                                class="hidden absolute left-0 right-0 top-[calc(100%+6px)] z-20 bg-white border border-crimson/20 rounded-xl shadow-xl p-2">
                                <ul id="category-options" role="listbox"
                                    class="max-h-44 overflow-y-auto flex flex-col gap-1"></ul>
                                <div class="mt-2 pt-2 border-t border-crimson/15 flex gap-1.5">
                                    <input type="text" id="new-category-input" placeholder="Add category..."
                                        maxlength="24" aria-label="Add category"
                                        class="flex-1 px-2.5 py-1.5 text-xs bg-paper border border-crimson/20 rounded-lg focus:outline-none focus:bg-white focus:border-crimson transition">
                                    <button type="button" id="add-category-btn"
                                        class="px-3 py-1.5 text-xs font-semibold bg-crimson hover:bg-[#690c37] text-white rounded-lg transition cursor-pointer">
                                        Add
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <p id="error-message" role="alert" aria-live="polite"
                        class="hidden text-xs text-red-800 bg-red-50 border border-red-200 border-l-4 border-l-red-700 px-3 py-2 rounded-md">
                    </p>

                    <button type="submit"
                        class="mt-auto w-full py-2.5 px-4 bg-crimson hover:bg-[#690c37] text-white text-sm font-semibold rounded-lg shadow-sm transition cursor-pointer">
                        Add Expense
                    </button>
                </form>
            </article>

            <article
                class="md:col-span-7 bg-white rounded-xl p-6 shadow-lg border border-crimson/15 border-t-4 border-t-coffee flex flex-col">
                <div class="flex flex-wrap items-center justify-between gap-3 pb-3 mb-4 border-b border-crimson/15">
                    <h2 class="text-lg font-bold text-coffee">Expense List</h2>

                    <div id="filter-group" class="flex flex-wrap items-center gap-1.5" role="group"
                        aria-label="Filter expenses by category"></div>
                </div>

                <ul id="expense-list" class="flex flex-col gap-2.5 flex-1"></ul>
            </article>

        </section>
    </main>

    <footer class="bg-coffee border-t-2 border-crimson text-linen/75 text-center text-xs py-4 px-5">
        Designed &amp; Built by RM Prudenciado &middot; Tracker Expense
    </footer>

</body>

</html>
